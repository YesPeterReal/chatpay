apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatpay-ledger
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chatpay-ledger
  template:
    metadata:
      labels:
        app: chatpay-ledger
    spec:
      containers:
      - name: chatpay-ledger
        image: 370924439074.dkr.ecr.eu-west-3.amazonaws.com/chatpay-ledger:latest
        ports:
        - containerPort: 8080
        env:
        - name: AWS_REGION
          value: "eu-west-3"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: chatpay-ledger-service
  namespace: default
spec:
  selector:
    app: chatpay-ledger
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: LoadBalancer